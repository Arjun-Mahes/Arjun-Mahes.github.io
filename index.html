<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arjun Mahes</title>
    <meta name="description" content="Personal website and digital garden of Arjun Mahes.">

    <!-- Stylesheet -->
    <link rel="stylesheet" href="styles.css?v=19">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..800;1,9..144,400..800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Orbitron:wght@600;700;800&display=swap"
        rel="stylesheet">

    <!-- Fast Markdown Parser -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- Three.js for 3D Circular WebGL Gallery -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>

<body>
    <div class="layout">
        <!-- Sidebar Navigation Frame -->
        <aside class="sidebar">
            <div class="sidebar-top">
                <nav class="nav-section">
                    <div class="section-label">Navigation</div>
                    <ul class="nav-list" id="nav-list">
                        <!-- Populated dynamically from info.md -->
                        <li><a href="#home" class="nav-link active">Home</a></li>
                        <li><a href="#projects" class="nav-link">Projects</a></li>
                        <li><a href="#work" class="nav-link">Work</a></li>
                    </ul>
                </nav>
            </div>

            <div class="sidebar-bottom">
                <div class="nav-section social-nav-section">
                    <div class="section-label">Find Me On</div>
                    <ul class="social-links" id="social-list">
                        <!-- Populated dynamically from info.md -->
                    </ul>
                </div>
            </div>
        </aside>

        <!-- Vertical Divider Line bounded by content -->
        <div class="vertical-divider"></div>

        <!-- Main Content Area -->
        <main class="content-wrapper">
            <!-- Header (Name & Bio Tagline - shown only on Home) -->
            <header class="profile-header" id="profile-header">
                <h1 class="site-title" id="site-name">Arjun Mahes</h1>
                <div class="site-tagline" id="site-tagline"></div>
            </header>

            <!-- Dynamic Markdown Content Container -->
            <article class="tab-content" id="tab-content">
                <!-- Populated dynamically from info.md -->
            </article>
        </main>
    </div>

    <!-- Client-side Markdown Engine & Router -->
    <script src="app.js?v=19"></script>
</body>

</html>
