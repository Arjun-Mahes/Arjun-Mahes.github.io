<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arjun Mahes</title>
    <meta name="description" content="Arjun Mahes — Mechatronics Engineering at the University of Waterloo. Robots, semiconductors, embedded systems and exoskeletons.">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">

    <!-- Theme: always start from the system's light/dark setting. Runs before paint so there's no flash. -->
    <script>
        (function () {
            try { localStorage.removeItem('theme'); } catch (e) {}   // clear any choice saved by older versions
            document.documentElement.dataset.theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        })();
        // Start fetching the page content now instead of after the scripts run (app.js picks it up)
        window.infoRequest = fetch('info.md', { cache: 'no-cache' }).catch(() => null);
        // A photo that fails to load gets one retry (past any cached failure) before it's dropped
        function retryImg(img) {
            if (img.dataset.retried) return img.remove();
            img.dataset.retried = '1';
            img.src = img.src.split('?')[0] + '?retry=' + Date.now();
        }
    </script>

    <!-- Fonts are self-hosted (fonts/, declared in fonts.css): no extra trips to Google before the page can draw.
         The three on the landing card start downloading straight away. -->
    <link rel="preload" href="fonts/righteous-400-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="fonts/dm-sans-400-700-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="fonts/space-mono-400-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="fonts.css?v=1">
    <link rel="stylesheet" href="styles.css?v=754">
</head>

<body>
    <!-- Background: topographic trail lines; the cursor raises a hill (bg.js) -->
    <canvas class="bg" id="bg" aria-hidden="true"></canvas>

    <!-- Light / dark toggle -->
    <button type="button" class="theme-switch" id="theme-toggle" role="switch" aria-checked="false" aria-label="Dark mode">
        <span class="switch-track" aria-hidden="true">
            <span class="switch-sun">☀️</span>
            <span class="switch-moon">🌙</span>
            <span class="switch-star s1"></span>
            <span class="switch-star s2"></span>
            <span class="switch-knob"></span>
        </span>
    </button>

    <!-- Landing: one card -->
    <main class="landing">
        <article class="card">
            <!-- Photo: images/me.webp -->
            <div class="card-photo">
                <img src="images/me.webp" alt="Portrait of Arjun Mahes" fetchpriority="high" onerror="retryImg(this)">
            </div>

            <div class="card-body">
                <p class="location">📍 Waterloo, ON</p>
                <h1 class="name" id="name">Arjun Mahes</h1>
                <p class="tagline" id="tagline"></p>
                <ul class="about" id="about"></ul>
                <div class="actions">
                    <button type="button" class="gallery-btn" id="open-gallery">Project gallery <span aria-hidden="true">🚀</span></button>
                    <div class="links" id="links"></div>
                </div>
            </div>
        </article>
    </main>

    <!-- Project gallery -->
    <div class="gallery" id="gallery" aria-hidden="true">
        <div class="gallery-backdrop" data-close-gallery></div>
        <section class="gallery-panel" role="dialog" aria-modal="true" aria-labelledby="gallery-title">
            <header class="gallery-head">
                <h2 id="gallery-title">🗂️ Project gallery</h2>
                <div class="filters" id="filters" role="group" aria-label="Filter projects"></div>
                <button type="button" class="close-btn" data-close-gallery aria-label="Close gallery">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </header>
            <div class="masonry" id="masonry"></div>
        </section>
    </div>

    <!-- Project deep dive -->
    <div class="project-modal" id="deep-dive" aria-hidden="true">
        <div class="modal-backdrop" data-close-dive></div>
        <article class="dive" role="dialog" aria-modal="true" aria-labelledby="dive-title">
            <button type="button" class="close-btn dive-close" data-close-dive aria-label="Close project">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
            <div class="dive-scroll" id="dive-scroll">
                <div class="dive-hero" id="dive-hero"></div>
                <div class="dive-body">
                    <p class="dive-where" id="dive-where"></p>
                    <h2 class="dive-title" id="dive-title"></h2>
                    <dl class="dive-facts" id="dive-facts"></dl>
                    <p class="dive-summary" id="dive-summary"></p>
                    <div id="dive-link"></div>
                    <div class="dive-details" id="dive-details"></div>
                </div>
                <nav class="dive-nav" aria-label="Other projects">
                    <button type="button" id="dive-prev"><small>← Previous</small><span></span></button>
                    <button type="button" id="dive-next"><small>Next →</small><span></span></button>
                </nav>
            </div>
        </article>
    </div>

    <!-- What's behind the 👋: wave at it enough and the map floods into this screen -->
    <section class="random" id="random" aria-hidden="true">
        <h2 class="random-title">Random</h2>
        <button type="button" class="random-back" id="random-back">← Back</button>
    </section>

    <script src="bg.js?v=49"></script>
    <script src="app.js?v=744"></script>
</body>

</html>
